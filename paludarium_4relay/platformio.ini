[platformio]
default_envs = esp32_4relay

[env:esp32_4relay]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
src_dir = .
build_src_filter = +<*>
lib_deps =
  bblanchon/ArduinoJson@^6.21.0
  adafruit/DHT sensor library@^1.4.0
  adafruit/Adafruit Unified Sensor@^1.1.0
  fastled/FastLED@^3.6.0
