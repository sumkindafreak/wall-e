; Ghostbusters Slime Blower — ESP32-S3 + FastLED + SD/I2S audio
; Open this folder in PlatformIO; .ino lives in project root (Arduino IDE compatible).

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = .
extra_configs =
  ../firmware_common/platformio_pioarduino.ini

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  FastLED
  file://../lib/walle_i2s_audio