; Ghostbusters Slime Blower — ESP32-S3 + FastLED + DFPlayer Mini
; Open this folder in PlatformIO; .ino lives in project root (Arduino IDE compatible).

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = .

[env:esp32-s3-devkitc-1]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  FastLED
  DFRobot/DFRobotDFPlayerMini@^1.0.6
