[platformio]
; PlatformIO remains the ESP32-S3 regression build for now.
; The ESP32-P4 production build uses Arduino-ESP32 3.3.11 / Arduino CLI.
default_envs = wall_e_brain_s3_regression
src_dir = .

[env:wall_e_brain_s3_regression]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
; Shared WALL-E libraries live one level above this project.
lib_extra_dirs = ../lib
; LROS + embedded assets need the large application partition.
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit PWM Servo Driver Library
  mikalhart/TinyGPSPlus
  jrowberg/I2Cdevlib-MPU6050
  pololu/VL53L1X
build_flags =
  -I main
  -I ../wall_e_audio
  -I ../protocols
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
build_src_filter =
  ; PlatformIO uses a normal C++ wrapper around the same canonical Arduino
  ; sketch to avoid nested .ino preprocessing/linker ambiguity.
  +<base_entry.cpp>
  +<main/*.cpp>
  ; Root main.ino is retained for repository/Arduino compatibility only.
  -<main.ino>
  ; Do not compile the historical duplicate receiver at repository root.
  -<espnow_receiver.cpp>
  ; main/main.ino is included by base_entry.cpp, not compiled twice.
  -<main/main.ino>
  ; Shared library supplies this implementation; avoid duplicate symbols.
  -<main/walle_emotion_pose.cpp>
