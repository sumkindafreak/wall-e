[platformio]
; PlatformIO remains the ESP32-S3 regression build for now.
; The ESP32-P4 primary build uses Arduino-ESP32 / Arduino CLI because P4
; PlatformIO board support depends on the installed platform version.
default_envs = wall_e_brain_s3_regression
src_dir = .
lib_extra_dirs = ../lib

[env:wall_e_brain_s3_regression]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
; LROS + embedded assets need the large application partition.
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit PWM Servo Driver Library
  mikalhart/TinyGPSPlus
  jrowberg/I2Cdevlib-MPU6050
  pololu/VL53L1X
build_flags =
  -I main
  -I ../wall_e_audio
  -I ../protocols
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
build_src_filter =
  ; Root main.ino is now only a wrapper around main/main.ino.
  +<main.ino>
  ; Compile the one canonical implementation tree.
  +<main/*.cpp>
  ; Do not compile the historical duplicate receiver at repository root.
  -<espnow_receiver.cpp>
  ; main/main.ino is included by the root wrapper, not compiled twice.
  -<main/main.ino>
  ; Shared library supplies this implementation; avoid duplicate symbols.
  -<main/walle_emotion_pose.cpp>
