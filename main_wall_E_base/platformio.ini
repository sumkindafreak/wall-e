[platformio]
default_envs = wall_e_brain_s3
src_dir = .
lib_extra_dirs = ../lib

[env:wall_e_brain_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
; Default "Default" partition = 0x140000 (1.25 MiB) per app — too small once LROS + embedded web_page_lros.h grew.
; huge_app: single ~3 MiB app + SPIFFS (fits typical 4 MiB flash). For 8 MiB boards you can use default_8MB.csv instead.
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  links2004/WebSockets @ ^2.4.1
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit PWM Servo Driver Library
  mikalhart/TinyGPSPlus
  jrowberg/I2Cdevlib-MPU6050
  pololu/VL53L1X
build_flags =
  -I main
  -I ../wall_e_audio
  -I ../protocols
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
; Use main/espnow_receiver.cpp (motion authority, full ControlPacket). Root espnow_receiver.cpp is legacy/unused.
build_src_filter =
  +<main.ino>
  +<main/*.cpp>
  -<main/main.ino>
  -<main/walle_emotion_pose.cpp>
