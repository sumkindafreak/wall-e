[platformio]
; WALL-E production Base Brain target: ESP32-S3.
; Native Wi-Fi / ESP-NOW is used directly on the S3 — no P4 or radio gateway
; hardware is required.
default_envs = wall_e_brain_s3
src_dir = .

[env:wall_e_brain_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
lib_extra_dirs = ../lib
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit PWM Servo Driver Library
  mikalhart/TinyGPSPlus
  jrowberg/I2Cdevlib-MPU6050
  pololu/VL53L1X
build_flags =
  -I main
  -I ../wall_e_audio
  -I ../protocols
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
build_src_filter =
  ; PlatformIO compiles the same canonical source tree used by Arduino IDE.
  +<base_entry.cpp>
  +<main/*.cpp>
  -<main.ino>
  ; Historical duplicate receiver at project root is not part of production.
  -<espnow_receiver.cpp>
  ; main/main.ino is included by base_entry.cpp, not compiled twice.
  -<main/main.ino>
