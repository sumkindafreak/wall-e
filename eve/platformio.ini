; EVE companion — ESP32-S3 (N16R8: 16 MB flash + 8 MB OPI PSRAM when enabled below)
[platformio]
default_envs = eve_s3
extra_configs =
  ../firmware_common/platformio_pioarduino.ini

[env:eve_s3]
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  lvgl/lvgl @ 9.2.2
  moononournation/GFX Library for Arduino @ ^1.5.9
  adafruit/Adafruit INA219 @ ^1.2.3
  adafruit/Adafruit BusIO @ ^1.14.5
  file://../lib/walle_i2s_audio
; pololu/VL53L1X @ ^1.3.1
build_flags =
  -I include
  -I awareness
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections
  -DCORE_DEBUG_LEVEL=0
  -DLV_CONF_INCLUDE_SIMPLE

; --- N16R8 full module (match WALL-E brain): uncomment if your PlatformIO has these ---
; board_build.flash_size = 16MB
; board_upload.flash_size = 16MB
; board_build.partitions = default_16MB.csv
; board_build.psram = opi
; board_build.arduino.memory_type = qio_opi
