[platformio]
default_envs = vision_s3

[env:vision_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600

; WALL-E's vision controller is the ESP32-S3 N16R8 variant:
; 16 MB QIO flash + 8 MB OPI PSRAM. PlatformIO's generic
; esp32-s3-devkitc-1 board defaults to N8/no-PSRAM, so override it here.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi

; esp_camera.h is supplied by Arduino-ESP32 itself.
build_flags =
  -DBOARD_HAS_PSRAM
