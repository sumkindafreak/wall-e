[platformio]
default_envs = vision_s3

[env:vision_s3]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600

; esp_camera.h is supplied by the ESP32 Arduino framework itself.
; Do not declare a separate esp32-camera registry package here.
build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
