name: WALL-E S3 Base CI

on:
  pull_request:
    paths:
      - 'main_wall_E_base/**'
      - 'wall_e_master_controller/**'
      - 'protocols/**'
      - '.github/workflows/walle-s3-base-ci.yml'
  push:
    branches:
      - 'agent/s3-base-brain'
    paths:
      - 'main_wall_E_base/**'
      - 'wall_e_master_controller/**'
      - 'protocols/**'
      - '.github/workflows/walle-s3-base-ci.yml'

concurrency:
  group: walle-s3-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s3-base:
    name: ESP32-S3 Base Brain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio

      - name: Compile WALL-E Base for ESP32-S3
        run: pio run -d main_wall_E_base -e wall_e_brain_s3
