name: WALL-E Hardware CI

on:
  pull_request:
    paths:
      - 'main_wall_E_base/**'
      - 'wall_e_master_controller/**'
      - 'dock_station/**'
      - 'vision_node/**'
      - 'protocols/**'
      - 'lib/**'
      - '.github/workflows/walle-s3-base-ci.yml'
  push:
    branches:
      - 'agent/s3-base-brain'
    paths:
      - 'main_wall_E_base/**'
      - 'wall_e_master_controller/**'
      - 'dock_station/**'
      - 'vision_node/**'
      - 'protocols/**'
      - 'lib/**'
      - '.github/workflows/walle-s3-base-ci.yml'

concurrency:
  group: walle-hardware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-S3 Base Brain
            project_dir: main_wall_E_base
            environment: wall_e_brain_s3
          - name: CYD Controller + Buttons
            project_dir: wall_e_master_controller
            environment: cyd_esp32_2432s028
          - name: WALL-E Dock Station
            project_dir: dock_station
            environment: dock_esp32
          - name: WALL-E Vision / Camera
            project_dir: vision_node
            environment: vision_s3

    steps:
      - uses: actions/checkout@v4

      - name: Install PlatformIO
        run: pip install --disable-pip-version-check platformio

      - name: Compile ${{ matrix.name }}
        run: pio run -d "${{ matrix.project_dir }}" -e "${{ matrix.environment }}"
