[platformio]
default_envs = cyd_esp32_2432s028
src_dir = .

[env:cyd_esp32_2432s028]
platform = espressif32
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
  bodmer/TFT_eSPI
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
  https://github.com/sparkfun/SparkFun_SX1509_Arduino_Library.git
  mikalhart/TinyGPSPlus
  adafruit/Adafruit ADS1X15
build_flags =
  -I ../wall_e_audio
  -I ../lib
build_src_filter =
  +<*.ino>
  +<*.cpp>
  -<walle_emotion_pose.cpp>
