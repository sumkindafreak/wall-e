; WALL-E Dock Station - Smart Charging Crate
; ESP32-S3 DevKitC-1 / ESP32-S3 N16R8 module

[platformio]
default_envs = dock_esp32
src_dir = .

[env:dock_esp32]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.flash_size = 16MB
monitor_speed = 115200
lib_deps =
  FastLED
  adafruit/Adafruit GFX Library
  adafruit/Adafruit ST7735 and ST7789 Library
  adafruit/Adafruit VL6180X
  adafruit/Adafruit BusIO
upload_speed = 921600

; OTA upload when dock is on home WiFi (set upload_port to dock's IP)
; upload_protocol = espota
; upload_port = 192.168.1.xxx
