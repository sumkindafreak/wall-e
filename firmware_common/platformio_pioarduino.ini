; Arduino ESP32 Core 3.x via pioarduino — single platform pin for all WALL-E firmware.
; Version map: https://github.com/sivar2311/platform-espressif32-versions
; Include from each module platformio.ini:
;   extra_configs = ../firmware_common/platformio_pioarduino.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
extra_scripts = pre:${PROJECT_DIR}/../firmware_common/platformio_framework_includes.py
build_flags =
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
  -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
