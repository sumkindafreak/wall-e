; PlatformIO project for WALL-E Audio ESP
; ESP32-S3 Audio / Voice / Dock Sensor Brain

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Use ESP32-S3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

; Local headers + shared protocol from wall_e_audio (audio_protocol.h)
build_flags =
    -I .
    -I ../wall_e_audio

lib_deps =
    DFRobot/DFRobotDFPlayerMini@^1.0.6
